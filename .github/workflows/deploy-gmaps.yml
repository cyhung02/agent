name: Deploy gmaps Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-workers/gmaps/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-workers/gmaps
